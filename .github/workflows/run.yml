name: run

# Runs one command against a branch of any public repository, on a free GitHub-hosted runner.
# Dispatched by tools/cloud-run.sh; only people with write access to this repository can dispatch it.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository to check out (owner/name)"
        required: true
      ref:
        description: "Branch, tag or commit"
        required: true
      command:
        description: "Bash command, run at the repository root"
        required: true
      label:
        description: "Unique label for this run (shown as the run name)"
        required: true
      fonts_ref:
        description: "storytold/craft-fonts commit to build with (CRAFT_FONTS_DIR), as upstream CI does; empty for none"
        required: false
        default: "bfcbf714e45a3ea8e98f88ab2b7971372a576414"
      apt:
        description: "Extra apt packages"
        required: false
        default: "libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers libvulkan1"

run-name: ${{ inputs.label }}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false

      - name: Check out craft-i18n at the pinned commit, if the repository pins one
        working-directory: src
        run: |
          if [ -f craft-i18n.rev ]; then
            rev=$(tr -d '[:space:]' < craft-i18n.rev)
            git clone -q --filter=blob:none https://github.com/storytold/craft-i18n "$GITHUB_WORKSPACE/craft-i18n"
            git -C "$GITHUB_WORKSPACE/craft-i18n" checkout -q "$rev"
            echo "CRAFT_I18N_DIR=$GITHUB_WORKSPACE/craft-i18n" >> "$GITHUB_ENV"
          fi

      - name: Check out craft-fonts
        if: inputs.fonts_ref != ''
        env:
          REF: ${{ inputs.fonts_ref }}
        run: |
          git clone -q --filter=blob:none https://github.com/storytold/craft-fonts "$GITHUB_WORKSPACE/craft-fonts"
          git -C "$GITHUB_WORKSPACE/craft-fonts" checkout -q "$REF"
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"

      - name: Install apt packages
        if: inputs.apt != ''
        env:
          PKGS: ${{ inputs.apt }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends $PKGS

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache key
        id: key
        env:
          REPO: ${{ inputs.repo }}
        run: echo "name=$(echo "${REPO#*/}" | tr -c 'a-zA-Z0-9-' '-')" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: ${{ steps.key.outputs.name }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run
        working-directory: src
        env:
          CMD: ${{ inputs.command }}
          CARGO_TERM_COLOR: never
          PHOTOCRAFT_NO_PRINT: "1"
          LPDEST: no-such-printer
        run: bash -eo pipefail -c "$CMD"
